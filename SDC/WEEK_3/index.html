<!doctype html>
<html>
  <head>
    <title>My Shop</title>

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>

  <body>
    <!-- Navigation Bar -->

    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html"> My Shop </a>

        <div>
          <a href="login.html" class="btn btn-primary"> Login </a>

          <a href="register.html" class="btn btn-success"> Register </a>
        </div>
      </div>
    </nav>

    <!-- Main Content -->

    <div class="container mt-5">
      <h1 class="text-center">Welcome to My Shop</h1>

      <p class="text-center">Simple Online Shopping Cart</p>

      <!-- Products -->

      <h2 class="mt-5">Products</h2>

      <div class="row mt-3">
        <!-- Mobile -->

        <div class="col-md-4 mb-3">
          <div class="card text-center p-3">
            <h3>Mobile</h3>

            <p>Price: ₹20,000</p>

            <button class="btn btn-primary" onclick="addCart('Mobile', 20000)">
              Add to Cart
            </button>
          </div>
        </div>

        <!-- Laptop -->

        <div class="col-md-4 mb-3">
          <div class="card text-center p-3">
            <h3>Laptop</h3>

            <p>Price: ₹50,000</p>

            <button class="btn btn-primary" onclick="addCart('Laptop', 50000)">
              Add to Cart
            </button>
          </div>
        </div>
        <!-- Headphones -->
        <div class="col-md-4 mb-3">
          <div class="card text-center p-3">
            <h3>Headphones</h3>

            <p>Price: ₹2,000</p>

            <button
              class="btn btn-primary"
              onclick="addCart('Headphones', 2000)"
            >
              Add to Cart
            </button>
          </div>
        </div>
      </div>

      <!-- Shopping Cart -->

      <h2 class="mt-5">Shopping Cart</h2>

      <div id="cart" class="mt-3">Cart is empty</div>

      <h4 class="mt-3">Total: ₹<span id="total">0</span></h4>

      <button class="btn btn-success mt-2" onclick="checkout()">
        Checkout
      </button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
