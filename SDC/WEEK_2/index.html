<!doctype html>
<html>
  <head>
    <title>My Shop</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- Bootstrap -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
      <div class="container">
        <a class="navbar-brand" href="index.html"> My Shop </a>
        <a class="btn btn-danger" href="login.html"> Login </a>
      </div>
    </nav>

    <div class="container mt-4">
      <h2 class="text-center">Products</h2>
      <!-- Products -->
      <div class="row mt-4">
        <!-- Product 1 -->
        <div class="col-md-4 mb-3">
          <div class="card p-3 text-center">
            <h4>Mobile</h4>
            <p>₹20,000</p>
            <button class="btn btn-primary" onclick="addCart('Mobile', 20000)">
              Add to Cart
            </button>
          </div>
        </div>
        <!-- Product 2 -->
        <div class="col-md-4 mb-3">
          <div class="card p-3 text-center">
            <h4>Laptop</h4>
            <p>₹50,000</p>
            <button class="btn btn-primary" onclick="addCart('Laptop', 50000)">
              Add to Cart
            </button>
          </div>
        </div>
      </div>
      <h2 class="mt-5">Shopping Cart</h2>
      <div id="cart">Cart is empty</div>
      <h4 class="mt-3">Total: ₹<span id="total">0</span></h4>
      <button class="btn btn-success" onclick="checkout()">Checkout</button>
    </div>
    <script src="script.js"></script>
  </body>
</html>
