<!doctype html>
<html>
  <head>
    <title>Shopping Cart</title>
    <link rel="stylesheet" href="styles.css" />
  </head>

  <body>
    <header>
      <h1>My Shop</h1>
      <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="register.html">Register</a>
      </nav>
    </header>
    <main>
      <div class="products">
        <div class="product">
          <h2>Laptop</h2>
          <p>₹50000</p>
          <button onclick="addCart('Laptop', 50000)">Add to Cart</button>
        </div>
        <div class="product">
          <h2>Mobile</h2>
          <p>₹20000</p>
          <button onclick="addCart('Mobile', 20000)">Add to Cart</button>
        </div>
        <div class="product">
          <h2>Headphones</h2>
          <p>₹2000</p>
          <button onclick="addCart('Headphones', 2000)">Add to Cart</button>
        </div>
      </div>
      <div class="cart">
        <h2>Shopping Cart</h2>
        <div id="cartItems"></div>

        <h3>Total: ₹<span id="total">0</span></h3>
        <button onclick="checkout()">Checkout</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
