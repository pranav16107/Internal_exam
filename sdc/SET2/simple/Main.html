<!-- Q1 (Short, Exp 2). Using the Bootstrap framework, design a responsive navigation bar with a brand name and the links Home, Catalog, Cart and Login that collapses into a hamburger menu on small screens.  -->

<html>
<head>
    <title>Navbar</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
</head>

<body>

<nav class="navbar navbar-expand-md navbar-dark bg-dark">
    <div class="container-fluid">

        <a class="navbar-brand" href="#">MyStore</a>

        <button class="navbar-toggler" data-bs-toggle="collapse"
        data-bs-target="#menu">
            <span class="navbar-toggler-icon"></span>
        </button>

        <div class="collapse navbar-collapse" id="menu">
            <ul class="navbar-nav ms-auto">
                <li><a class="nav-link" href="#">Home</a></li>
                <li><a class="nav-link" href="#">Catalog</a></li>
                <li><a class="nav-link" href="#">Cart</a></li>
                <li><a class="nav-link" href="#">Login</a></li>
            </ul>
        </div>

    </div>
</nav>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
