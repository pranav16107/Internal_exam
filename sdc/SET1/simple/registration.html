<!-- Q1 (Short, Exp 1). Create a registration page with Name, Email, Password, Confirm Password and a Submit button. Use CSS3 Flexbox to align each label and input in a row and to centre the form card on the page.  -->
<html>
<head>
    <title>Registration Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form">
        <h2>Registration Form</h2>

        <form>
            <div class="row">
                <label>Name:</label>
                <input type="text">
            </div>

            <div class="row">
                <label>Email:</label>
                <input type="email">
            </div>

            <div class="row">
                <label>Password:</label>
                <input type="password">
            </div>

            <div class="row">
                <label>Confirm Password:</label>
                <input type="password">
            </div>

            <button type="submit">Submit</button>
        </form>
    </div>

</body>
</html>
