<!-- Q1 (Short, Exp 3). Write JavaScript to validate a login form on the client side: the email must match a valid pattern and the password must have at least 8 characters including one digit. Show error messages below the fields and block submission when validation fails. -->

<html>
<head>
    <title>Login Form</title>
</head>
<body>

<h2>Login Form</h2>

<form onsubmit="return validate()">

    Email:
    <input type="text" id="email">
    <p id="e1" style="color:red"></p>

    Password:
    <input type="password" id="pass">
    <p id="e2" style="color:red"></p>

    <button type="submit">Login</button>

</form>

<script src="script.js"></script>

</body>
</html>
